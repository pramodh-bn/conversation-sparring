name: Python tests and demo

on:
  push:
    branches: [dev, 'codex/**', 'claude/**', 'muse/**']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Run full test suite
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Run deterministic demo
        run: |
          set -o pipefail
          python scripts/demo_run.py | tee demo-results.txt
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-results
          path: |
            test-results.xml
            demo-results.txt
